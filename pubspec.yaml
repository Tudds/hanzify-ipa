name: hanzify
description: "Flutter Web + Supabase language learning game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  supabase_flutter: ^2.1.0
  shared_preferences: ^2.5.5
  drift: ^2.30.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1
  just_audio: ^0.10.4
  flutter_animate: ^4.5.0
  flutter_svg: ^2.2.3
  confetti: ^0.7.0
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  drift_dev: ^2.30.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/learning_path/
    - assets/data/generated/
    - assets/data/shorts/
    - assets/images/
  # Self-hosted, subset variable fonts (latin + HSK1-4 Hanzi). Replaces the
  # Google Fonts CDN <link> in web/index.html, which was render-blocking and
  # blocked by the COEP `require-corp` policy in web/_headers. Subset via
  # tool/subset_fonts.sh. wght axis retained so weights interpolate from one file.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-subset.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-subset.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-subset.ttf
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC-subset.ttf
