name: hanzify
description: "Flutter Web + Rive + Supabase language learning game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  rive: ^0.13.20
  supabase_flutter: ^2.1.0
  shared_preferences: ^2.5.5
  drift: ^2.30.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1
  just_audio: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  drift_dev: ^2.30.0

flutter:
  uses-material-design: true
  assets:
    - assets/rive/
    - assets/data/
    - assets/data/learning_path/
    - assets/data/generated/
