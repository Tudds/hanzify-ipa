name: iOS Build No Signing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS (Unsigned)
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Loại bỏ cảnh báo Node.js 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fix iOS Deployment Target (Pbxproj & Podfile)
        run: |
          # 1. Sửa trong project file
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 2. Sinh ra Podfile chuẩn của Flutter
          flutter build ios --no-codesign --config-only
          
          # 3. Ép toàn bộ Pods dùng iOS 15.0 để tránh lỗi NWPath
          if [ -f ios/Podfile ]; then
            echo "post_install do |installer|" >> ios/Podfile
            echo "  installer.pods_project.targets.each do |target|" >> ios/Podfile
            echo "    target.build_configurations.each do |config|" >> ios/Podfile
            echo "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'" >> ios/Podfile
            echo "    end" >> ios/Podfile
            echo "  end" >> ios/Podfile
            echo "end" >> ios/Podfile
          fi

      - name: Build iOS IPA (No Signing)
        run: flutter build ipa --no-codesign
          
      - name: Create Unsigned IPA
        run: |
          mkdir -p build/ios/unsigned
          mkdir -p Payload
          APP_PATH=$(find build/ios/archive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r build/ios/unsigned/hanzify-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hanzify-unsigned-ipa
          path: build/ios/unsigned/hanzify-unsigned.ipa
