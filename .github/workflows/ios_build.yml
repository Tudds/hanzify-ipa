name: iOS Build No Signing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fix iOS Deployment Target in project.pbxproj
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS IPA (No Signing)
        run: flutter build ipa --no-codesign

      - name: Create Unsigned IPA
        run: |
          mkdir -p build/ios/unsigned
          mkdir -p Payload
          APP_PATH=$(find build/ios/archive -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r build/ios/unsigned/hanzify-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hanzify-unsigned-ipa
          path: build/ios/unsigned/hanzify-unsigned.ipa
