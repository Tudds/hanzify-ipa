name: iOS Build No Signing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Context Graph
        run: dart run tool/build_graph.dart

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: pods-

      - name: Build iOS (No Signing)
        run: flutter build ios --no-codesign

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/ios/Release-iphoneos -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          mkdir -p build/ios/unsigned
          zip -r build/ios/unsigned/hanzify-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hanzify-unsigned-ipa
          path: build/ios/unsigned/hanzify-unsigned.ipa
